name: Build and Deploy APT Repository

on:
  push:
    branches:
      - main
    paths:
      - 'vista-template/usr/**'
      - 'vista-template/DEBIAN/control'
  workflow_dispatch: # Permet de déclencher la génération manuellement depuis GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install APT tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Prepare permissions and cleanup
        run: |
          # Supprimer les .gitkeep pour éviter les conflits inter-paquets
          find vista-template -name ".gitkeep" -delete
          # Permissions standard Debian
          chmod 755 vista-template/DEBIAN
          chmod 644 vista-template/DEBIAN/control
          find vista-template/usr/lib -type f -name "Vista" -exec chmod +x {} +
          find vista-template/DEBIAN -type f -not -name "control" -exec chmod +x {} +

      - name: Build Debian Package
        run: |
          # Récupère la version actuelle depuis le fichier control
          VERSION=$(grep -oP '(?<=^Version: ).*' vista-template/DEBIAN/control)
          if [ -z "$VERSION" ]; then
            VERSION="1.0"
          fi
          
          # Ajoute le numéro de run GitHub pour éviter les conflits de version dans APT
          FULL_VERSION="${VERSION}.${{ github.run_number }}"
          sed -i "s/^Version:.*/Version: $FULL_VERSION/" vista-template/DEBIAN/control
          
          # Construit le package .deb
          dpkg-deb --build vista-template "vista_${FULL_VERSION}_amd64.deb"
          
          # Exporte la version pour la création de la release
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Generate APT Repository Directory
        run: |
          # L'arborescence standard d'un dépôt APT
          mkdir -p public/dists/stable/main/binary-amd64
          mkdir -p public/pool/main
          
          # On copie notre .deb dans le pool
          cp *.deb public/pool/main/
          
          cd public
          
          # Génération du fichier d'index Packages
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          cat dists/stable/main/binary-amd64/Packages | gzip -9c > dists/stable/main/binary-amd64/Packages.gz
          
          # Création du fichier Release
          cd dists/stable
          cat <<EOF > Release
          Origin: Vista Repository
          Label: Vista APT Repository
          Suite: stable
          Codename: stable
          Version: 1.0
          Architectures: amd64
          Components: main
          Description: Official APT repository for Vista
          EOF
          
          # Génération des checksums de sécurité pour APT (format: hash taille fichier)
          generate_hashes() {
            algo_header=$1
            cmd=$2
            echo "${algo_header}:" >> Release
            for file in main/binary-amd64/Packages main/binary-amd64/Packages.gz; do
              hash=$($cmd "$file" | cut -d' ' -f1)
              size=$(stat -c %s "$file")
              echo " $hash $size $file" >> Release
            done
          }
          
          generate_hashes "MD5Sum" "md5sum"
          generate_hashes "SHA1" "sha1sum"
          generate_hashes "SHA256" "sha256sum"
          generate_hashes "SHA512" "sha512sum"

          # Signature GPG conditionnelle
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "Clé privée détectée, signature du dépôt..."
            
            # Importer la clé privée
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
            
            # Obtenir l'ID de la clé pour être sûr d'utiliser la bonne
            KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5}')
            
            # Signer le fichier Release avec SHA-256 (requis par APT moderne)
            gpg --default-key "$KEY_ID" --digest-algo SHA256 -abs -o Release.gpg Release
            gpg --default-key "$KEY_ID" --digest-algo SHA256 --clearsign -o InRelease Release
            
            # Exporter la clé publique à la racine du site publicisée (pour que vos utilisateurs puissent l'ajouter)
            gpg --armor --export "$KEY_ID" > "$GITHUB_WORKSPACE/public/vista.asc"
            echo "Signature réussie. Clé publique disponible sous vista.asc"
          else
            echo "Aucune clé GPG trouvée dans les secrets (GPG_PRIVATE_KEY). Dépôt non signé."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FULL_VERSION }}
          name: Vista v${{ env.FULL_VERSION }}
          files: vista_${{ env.FULL_VERSION }}_amd64.deb
          generate_release_notes: true
